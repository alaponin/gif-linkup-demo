# The once-only exchange. Generated by bb-config-gen (prompts/once-only-exchange.md).
# Do not hand-edit — regenerate. Spec: X-Road Message Protocol for REST (r1);
# PAERA §5.2 Principle #5 (Once-Only).
module: "once-only-exchange"
building_block: x-road-bus
exchange:
  name: once-only-credential-application
  scenario: >
    A learner applies for a senior-secondary certificate at PNEA. PNEA pre-fills
    identity from PNIA and enrolment from PLR over the bus. The learner provides
    one field: their NIN. Nothing else is asked.
  consumer: PROGRESSA/GOV/PNEA/EXAMS
  entrypoint: http://ss-pnea:8080        # consumer-side Security Server REST interface
  calls:
    - service: PROGRESSA/GOV/PNIA/IDENTITY/identity-api
      request: GET /persons/{nin}
      r1_path: /r1/PROGRESSA/GOV/PNIA/IDENTITY/identity-api/persons/{nin}
      prefills: [given_name, family_name, date_of_birth, sex, region]
      layer_technical: routed cross-server, mutual TLS between security servers
      layer_legal: returns only the fields the credential purpose needs (decree, Topic 2)
    - service: PROGRESSA/GOV/PLR/ENROLMENT/enrolment-api
      request: GET /enrolments/{nin}
      r1_path: /r1/PROGRESSA/GOV/PLR/ENROLMENT/enrolment-api/enrolments/{nin}
      prefills: [school, level, enrolment_year, status]
      layer_organisational: between members the governance admitted (Topic 3)
      layer_semantic: resolves because PNEA/PNIA/PLR share the semantic map (Topic 4)
  asked_once:
    citizen_provides: [nin]
    prefilled_from_bus: [given_name, family_name, date_of_birth, sex, region,
                         school, level, enrolment_year, status]
  headers:
    X-Road-Client: PROGRESSA/GOV/PNEA/EXAMS
  negative_check:
    # Wave 3 Task 1 (D1): moved off the now-retired MOEYS/PEMIS onto
    # PLR:ENROLMENT -- already a bus member, already a provider, and already
    # holding no grant on PNIA's identity-api. Denial confirms the same
    # point: being on the bus is not permission to call everything.
    unauthorised_client: PROGRESSA/GOV/PLR/ENROLMENT
    # Routed through the SS that hosts PLR:ENROLMENT (its own server, in
    # every profile), so the denial genuinely comes from the provider-side
    # ACL — not from ss-pnea rejecting a client it does not host.
    entrypoint: http://ss-plr:8080
    expect: X-Road access-denied error on PNIA's identity-api (ACL grants PNEA:EXAMS only)
