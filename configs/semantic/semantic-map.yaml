# The Module 4 semantic map — referenced by configs/member-plr/2.4.yaml and
# configs/member-pnia/2.5.yaml's semantic: blocks, and checked (not merely
# published) by apps/join-api/validate.py's _check_purpose_limitation:
# semantic.entity must be a key below, and every semantic.fields
# entry must be declared for that entity.
#
# Entity -> source anchor -> field list only: no
# per-field element descriptions here -- the anchor is where those live.

# A second, normative anchor for the same fields: GovStack Identity 2.0 §7.2's
# OIDC standard claims. Three renames carry across --
# date_of_birth -> birthdate, sex -> gender, region -> address.region.
person:
  anchor: CEDS
  fields: [nin, given_name, family_name, date_of_birth, sex, region]
enrolment:
  anchor: OneRoster
  fields: [nin, school, level, enrolment_year, status]
# The entity apps/specs/ptsb-awards.openapi.yaml publishes. Fields match that
# spec's declared 200 response exactly -- without this entry the pack's own
# live-join fixture is rejected by _check_purpose_limitation.
award:
  anchor: CEDS
  fields: [nin, award_id, program, year]

# The exchange assembles out/application-<nin>.json from these entities. Its
# target form is a W3C VC 2.0 credentialSubject (Wallet BB) -- the KP4
# certificate seam, not an entity here: no service publishes it.
# Tier-1 pattern labels and their BB anchors: docs/pattern-register.md.
