# PLR registration + enrolment service. Generated by bb-config-gen (prompts/register-member.md).
# Do not hand-edit — regenerate. Spec: NIIS X-Road subsystem + service description + access rights.
module: "plr"
building_block: member-plr
# member/subsystem identity comes from manifest.yaml's identity.members.plr
# now -- restating it here was a second, driftable copy of the same values.
# Dogfooded.
security_server:
  code: SS-PLR
  dns_name: ss-plr
services:
  # type/forwarding URL/enabled/tls_verify: not config fields, see 2.2.yaml's
  # comment -- hurl/generate.py never reads them. Dogfooded.
  - code: enrolment-api
    spec_url: http://app-plr:8000/spec.yaml
    lawful_basis: "Learner Registry Act, PLR as the authoritative source of enrolment records" # illustrative wording, not a real signed statute reference
    access:                    # deliberate: PNEA only (negative check 2.6 now tests PNIA's identity-api, not this service)
      - PROGRESSA/GOV/PNEA/EXAMS
    sla:                       # Module 5.3's template —
                                # illustrative demo values, not a real signed target.
      availability: "99.5% monthly uptime"
      response_time: "4 business hours; 1 hour for a P1 incident"
      support_hours: "Mon-Fri 08:00-18:00 ICT"
      incident_response: "P1 acknowledged within 1 hour, resolution target 8 hours"
      change_notice: "5 business days for a planned change"
      signatory: "Head of IT, PLR"
semantic:                      # from configs/semantic/semantic-map.yaml — 'enrolment' means:
  entity: enrolment
  key: nin
  fields: [nin, school, level, enrolment_year, status]
  pattern: digital_registries_lookup
member_requirements:           # Module 5.2's checklist (K-01).
  has_security_server: true
  has_registered_identity: true
  standards_portfolio_adopted: true
  data_conformant: true
  # lawful_basis intentionally absent here: a provider's own service states
  # it (see the enrolment-api service block above), not duplicated on the
  # member as a whole.
  technical_contact: "Head of IT, PLR"
