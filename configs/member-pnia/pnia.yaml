# PNIA registration + identity service. Generated by bb-config-gen (prompts/register-member.md).
# Do not hand-edit — regenerate. Spec: NIIS X-Road subsystem + service description + access rights.
module: "pnia"
building_block: member-pnia
# member/subsystem identity comes from manifest.yaml's identity.members.pnia
# now -- restating it here was a second, driftable copy of the same values.
# Dogfooded.
security_server:
  code: SS-PNIA
  dns_name: ss-pnia
services:
  # type/forwarding URL/enabled/tls_verify: not config fields, see 2.2.yaml's
  # comment -- hurl/generate.py never reads them. Dogfooded.
  - code: identity-api
    spec_url: https://app-pnia:8443/spec.yaml
    lawful_basis: "National Identity Decree, purpose-limited person lookup for credential issuance" # illustrative wording, not a real signed statute reference
    access:                    # deliberate: PNEA only — PLR:ENROLMENT excluded (negative check 2.6)
      - PROGRESSA/GOV/PNEA/EXAMS
    sla:                       # Module 5.3's template —
                                # illustrative demo values, not a real signed target.
      availability: "99.5% monthly uptime"
      response_time: "4 business hours; 1 hour for a P1 incident"
      support_hours: "Mon-Fri 08:00-18:00 ICT"
      incident_response: "P1 acknowledged within 1 hour, resolution target 8 hours"
      change_notice: "5 business days for a planned change"
      signatory: "Head of IT, PNIA"
semantic:                      # from configs/semantic/semantic-map.yaml — 'person identity' means:
  entity: person
  key: nin
  fields: [nin, given_name, family_name, date_of_birth, sex, region]
  pattern: digital_registries_lookup
member_requirements:           # Module 5.2's checklist.
  has_security_server: true
  has_registered_identity: true
  standards_portfolio_adopted: true
  data_conformant: true
  # lawful_basis intentionally absent here: a provider's own service states
  # it (see the identity-api service block above), not duplicated on the
  # member as a whole.
  technical_contact: "Head of IT, PNIA"
