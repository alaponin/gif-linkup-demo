- id: S3.2
  section: "3"
  clause: >-
    Steps 7-11 for both shapes, with client-add before signing-key generation
    before registration
  status: implemented
  note: >-
    The order the path calls load-bearing, and the code documents why: the
    signer rejects a member id it does not yet recognise as a client.
