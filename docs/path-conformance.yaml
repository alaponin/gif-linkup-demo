    message-log archive to out/retired/kp2-<key>-archive.tar.gz BEFORE the
    docker volume rm that used to be the whole instruction, so following the
    printed block preserves the records instead of destroying them.
    Simulated, not implemented, and the distinction is the honest one: a
    tarball on the Docker host has no expiry, no access control and no
    off-host copy, and nothing verifies the operator ran the command. A real
    retention regime is a policy and a storage commitment, which this pack
    cannot make -- what it can do is stop the demo from teaching the
    deletion.
  evidence:
    - {path: acceptance/join-member.md, symbol: RETIRED}
    - {path: runbook.md, symbol: retention}
    - {path: apps/join-api/job.py, symbol: retire_instruction}
    - {path: apps/join-api/writer.py, symbol: render_retirement_record}

