# What this build pack implements of the member onboarding path it teaches.
#
# THE GATE MODEL BELOW IS THIS PACK'S OWN. It was drafted in three working
# documents that are not carried here: they were work in progress, and a
# status register that cited a draft as its authority claimed more than the
# draft could support. The clauses, their ids and the gate names survive in
# this file and in scripts/render_path_conformance.py's SECTION_TITLES, which
# together are now the whole definition -- there is no external document to
# check them against, and none is implied.
#
# THIS FILE IS THE ONLY PLACE THE PACK STATES ITS STATUS AGAINST THAT MODEL.
# docs/path-conformance.md is generated from it and must not be hand-edited.
# Narrative documents (docs/production-delta.md, docs/decisions/) carry
# reasoning; a status claim in one of them drifts from this file, and a claim
# that drifts far enough records a gap as closed by a file nobody wrote.
# That is what this file makes impossible: tests/test_path_conformance.py
# asserts that every `path:` below exists on disk and every `symbol:` is
# found in it, so a claim cannot outlive its evidence.
#
# Four statuses, and no tick mark -- "checked" is what let "labelled" pass as
# "built":
#
#   implemented   A real artefact or check. If the pack broke it, something
#                 would fail. Evidence is the check itself.
#   simulated     Exercised for real, but the fidelity is faked (Test CA,
#                 mock backends, synthetic data). Legitimate in a build pack.
#                 Evidence must include where the simulation is declared.
#   named-absence Not built, and the pack says so where a reader following it
#                 will meet the absence. Evidence is that naming.
#   out-of-scope  Deliberately not this pack's job. Requires `rationale`.
#
# A clause with no honest home in those four is a defect, not a fifth status.

