# Conformance of this build pack against the member onboarding path.
#
# THIS FILE IS THE ONLY PLACE THE PACK STATES ITS STATUS AGAINST THE PATH.
# docs/path-conformance.md is generated from it and must not be hand-edited.
# Narrative documents (docs/onboarding-alignment-design.md,
# docs/onboarding-path-gap-analysis.md, docs/production-delta.md) carry
# reasoning; when they carry a status claim as well, the two drift, and on
# 2026-08-08 an external review found three findings recorded as closed by
# files that had never been created. That is the failure this file exists to
# make impossible: tests/test_path_conformance.py asserts that every `path:`
# below exists on disk and every `symbol:` is found in it, so a claim can no
# longer outlive its evidence.
#
# Four statuses, and no tick mark -- "checked" is what let "labelled" pass as
# "built":
#
#   implemented   A real artefact or check. If the pack broke it, something
#                 would fail. Evidence is the check itself.
#   simulated     Exercised for real, but the fidelity is faked (Test CA,
#                 mock backends, synthetic data). Legitimate in a build pack.
#                 Evidence must include where the simulation is declared.
#   named-absence Not built, and the pack says so where a reader following it
#                 will meet the absence. Evidence is that naming.
#   out-of-scope  Deliberately not this pack's job. Requires `rationale`.
#
# A clause with no honest home in those four is a defect, not a fifth status.

