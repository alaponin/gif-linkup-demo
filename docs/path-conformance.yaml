# -- G1 ----------------------------------------------------------------------

- id: G1.1
  section: G1
  clause: The Steering Committee decides admission; the Operating Authority recommends
  status: out-of-scope
  rationale: >-
    In both reference instantiations the decision is taken outside any system
    (Estonia: a RIHA registry record; Finland: a form to DVV), and path 4
    states G0-G3 are "not automatable, and should not be". Building a
    committee role would model a control no X-Road operator has. What is
    in scope is the coupling -- a technical join that cannot complete without
    a reference to the decision -- which is G1.2.
  evidence:
    - {path: onboarding/plr/00-gates.md, symbol: "Steering Committee"}

- id: G1.2
  section: G1
  clause: The technical join is coupled to the admission decision
  status: implemented
  note: >-
    POST /approve refuses without a decision_reference and rejects the
    applicant token outright. The reference, the request id, the approving
    role and the timestamp are now written into a per-member admission
    record (onboarding/<key>/01-admission.md), so the coupling leaves a
    gate-exit artefact, not just an API-boundary check.
  evidence:
    - {path: apps/join-api/app.py, symbol: decision_reference}
    - {path: apps/join-api/writer.py, symbol: render_admission_record}

- id: G1.3
  section: G1
  clause: Exit test -- the allocated identity is unique and legal
  status: implemented
  note: >-
