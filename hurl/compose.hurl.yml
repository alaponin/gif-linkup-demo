# Overlay that adds the Hurl runner to the Linkup demonstration federation.
# Basis: nordic-institute/X-Road @ 7.7.0, Docker/xrd-dev-stack/compose.yaml.
# Used together with the base file:
#   docker compose -f docker-compose.yml -f hurl/compose.hurl.yml ...
# hurl/run-linkup.sh does this for you.
#
# Two things this overlay adds beyond the runner itself:
#   1. a shared volume carrying the Test CA's ca.pem / ocsp.pem / tsa.pem into
#      the runner's --file-root, so the certification-service requests can
#      upload them without a docker cp dance;
#   2. a TIGHTENED healthcheck budget on cs and the Security Servers, on top
#      of the steady-state one docker-compose.yml now carries for every
#      service (base-compose hardening, docs/plans/production-hardening-plan.md
#      Phase A) -- this overlay only extends that budget, it does not
#      originate it. ca's healthcheck moved to the base file outright: it has
#      none of the persisted-volume slow-restart behaviour documented below
#      that justifies a longer budget here, so there is nothing to tighten.

services:
  # ca's `ca-certs:/home/ca/certs` mount used to live here and moved to the
  # base docker-compose.yml (Phase F, row 18): spec-fetcher needs the same
  # public trust anchor with no overlay loaded, so the base file has to
  # declare it. Nothing overlay-specific is left to say about `ca` -- the
  # runner below still mounts the same named volume.

  cs:
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:4000"]
      interval: 5s
      retries: 120

  # retries: 120 (10 min budget, doubled from an initial 60/5min at P0):
  # a from-zero boot passes well within 5 min, but a restart from persisted
  # volumes (docker compose down without --purge, then up again) can take a
  # Security Server longer to re-establish its signer/proxy state than a fresh
  # init -- `docker compose run --rm hurl`'s dependency wait treats an
  # already-unhealthy container as a hard failure rather than continuing to
  # poll, so the budget has to cover the slower path, not just the common one.
  ss-pdga:
    healthcheck: &ss-health
      test: ["CMD", "curl", "-f", "-k", "https://localhost:4000"]
      interval: 5s
      retries: 120
  ss-pnea:
    healthcheck: *ss-health
  ss-plr:
    healthcheck: *ss-health
  ss-pnia:
    healthcheck: *ss-health

  hurl:
    # Pinned inline, not via a deployment.yaml key: hurl is a build/test
    # tool this pack depends on, not part of the federation it deploys, so it
    # does not move in lockstep with an X-Road version bump the way
    # cs/ss/testca do. Resolved from the image this pack was last deployed
    # with (docker image inspect --format
    # '{{index .RepoDigests 0}}' ghcr.io/orange-opensource/hurl:latest).
    image: ghcr.io/orange-opensource/hurl:latest@sha256:d7727dcc0166de8aea88916e73ea435ee09bfecb8ba0c281200206b6cf37cf64
    container_name: hurl
    # "tools" keeps it out of `docker compose up`; `docker compose run hurl`
    # activates the profile on its own.
    profiles: ["tools"]
    networks: [linkup]
    volumes:
      - ./hurl:/hurl-src:ro
      - ca-certs:/hurl-files/ca:ro
      # Read-write, unlike the two above: hurl/run-linkup.sh's --report-json
      # goes here -- /hurl-src is read-only on purpose (generated files are
      # never written back into hurl/ from a container), so the report needs
      # its own mount.
      - ./out:/hurl-out
    depends_on:
      cs:
        condition: service_healthy
      ca:
        condition: service_healthy
      ss-pdga:
        condition: service_healthy
      ss-pnea:
        condition: service_healthy
      ss-plr:
        condition: service_healthy
      ss-pnia:
        condition: service_healthy

volumes:
  # Same named volume the base file now declares -- restated so this overlay
  # stays readable on its own; Compose merges the two identical entries.
  ca-certs: {name: kp2-ca-certs}
