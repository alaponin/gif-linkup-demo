# deployment.yaml — the KP2 analyst-facing deployment spec.
# Secrets (token PIN, admin password) stay in .env — never here, this file is
# git-committed. Do not hand-edit configs/*.yaml or hurl/scenarios/ to change
# deployment shape; change this file and regenerate (hurl/generate.py).

# Changing target away from docker-local? Read docs/deployment-targets.md
# first -- it states what every other dimension below has to become.
target: docker-local   # only supported value today. Future: itu-cloud, vm

network:
  # Host interface every published port binds to. 127.0.0.1 keeps the whole
  # stack reachable from this machine and from nowhere else. Reaching it from
  # elsewhere is an SSH tunnel or a VPN, not a change here.
  #
  # Any other value ALSO requires acknowledge_public_exposure: true below --
  # see scripts/lib-stack.sh's refusal for what is actually being exposed.
  bind: 127.0.0.1
  # acknowledge_public_exposure: true

xroad:
  version: 7.7.0
  cs_tag: noble-7.7.0
  testca_tag: "latest@sha256:018e9f6ea04634ec61a3d44abee9a86d9dc4f6a2508296fd8db95d272c16c0c5"
  # Digest pins (pin by digest, keep the *_tag/version above for
  # readability) -- resolved from the images this pack was
  # actually running (docker image inspect --format
  # '{{index .RepoDigests 0}}'), not from a fresh pull.
  cs_digest: "noble-7.7.0@sha256:679ef9969b963505a79d52e933b7f34d65517ccc2746aa6097aee3893e2b0b42"
  ss_digest: "7.7.0@sha256:5fb081414b6654d7c6ac8b92d398e7d5df0123d1efb04111af5a578b55fb3d54"
  # Proxy authorization-cache period, seconds -- rendered into every Security
  # Server's /etc/xroad/conf.d/local.ini by hurl/generate.py (hurl/local.ini).
  # X-Road 7.7.0's documented default is 60, confirmed live; this demo runs 5
  # so an ACL change is filmable. The trade and the measurement live in the
  # generated file's own comment block (LOCAL_INI in hurl/generate.py) and in
  # docs/production-delta.md. A production federation sizes this deliberately
  # -- start from 60.
  server_conf_cache_period: 5

datastore:
  # Where join-api keeps request records and issued tokens.
  # sqlite (default): out/join-store/join-store.sqlite3, single host, single
  # process -- matches docker-local. postgres: a DigitalOcean Managed
  # PostgreSQL cluster (see runbook.md's "The Postgres join store" section);
  # DSN comes from .env (KP2_JOIN_DB_URL), never from this file.
  kind: sqlite

join_workflow:
  # advisory (default): today's behaviour -- the console shows the
  # live-but-uncommitted flag, nothing gates. required: the job BLOCKS at
  # config.commit until the member's config, manifest.yaml and
  # onboarding/<key>/ are committed (docs/production-delta.md row 33).
  commit_gate: advisory
  # false (default): any applicant or operator credential may read any
  # request record -- fine in a demo where one person plays both roles.
  # true (the droplet target): GET /requests/{id} 404s for anyone but the
  # operator, an issued applicant:<name> credential reading its own
  # submission, or -- only while .env's KP2_JOIN_APPLICANT_TOKEN is still
  # a real value, not "disabled" -- the shared applicant reading a
  # submitted_by: null record (docs/production-delta.md row 28). Only
  # meaningful once the shared token is also disabled; with it still
  # enabled this protects per-agency records from each other, nothing
  # more.
  enforce_ownership: false
  # false (default): a joining member's spec_url may be plain http, exactly
  # as it always could -- the transition, so this pack's own fixtures could
  # move to https ahead of the switch rather than in lockstep with it.
  # true (the droplet target): apps/join-api/validate.py's https_spec_url
  # check REJECTS a plain-http spec_url before check 9 fetches it
  # (docs/production-delta.md row 18). What the https path actually buys:
  # apps/spec-fetcher verifies the certificate against a real trust store
  # (public roots PLUS the deployment's own CA bundle, never verify=False),
  # so at validate time a spec cannot be served by whoever holds the wire.
  # What it does not buy: the Security Server's own fetch of the same
  # spec_url, when it adds the service description, does NOT verify the
  # backend certificate -- measured against 7.7.0, see row 18.
  require_https_spec_url: false
