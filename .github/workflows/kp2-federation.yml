# KP2 federation on DigitalOcean — on-demand up / redeploy / destroy.
#
# Everything it drives is in infra/ (Terraform module, remote-deploy.sh, and
# the deployment analysis those two came from).
#
# Repository secrets required (Settings -> Secrets and variables -> Actions):
#   DO_TOKEN                  DigitalOcean API token, write scope
#   SPACES_ACCESS_KEY_ID      Spaces key pair, for the Terraform state bucket
#   SPACES_SECRET_ACCESS_KEY
#   KP2_SSH_PRIVATE_KEY       Deploy keypair: ssh-keygen -t ed25519 -f kp2-deploy
#   KP2_SSH_PUBLIC_KEY        ...private half and public half respectively
#   KP2_CONSOLE_HTPASSWD      One PRE-HASHED htpasswd line guarding the public
#                             console: `htpasswd -nB kp2demo` locally, paste the
#                             output line. CI never sees the cleartext; tell the
#                             audience the password at the demo.
#
# The Postgres join store (deployment.yaml: datastore.kind: postgres) needs
# NO additional secrets: the db-sync step below reuses DO_TOKEN, the Spaces
# key pair and the SSH key it already has.
#
# actions: up = create/refresh infra AND deploy the pack; deploy = rerun the
# pack deploy on the existing droplet; destroy = tear the droplet down
# (the DO project and state bucket survive).

name: KP2 federation (DigitalOcean)

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [up, deploy, destroy]
        default: up
      redeploy:
        description: "Purge + redeploy even if the federation is already running (teardown.sh --purge first)"
        type: boolean
        default: false

concurrency: kp2-federation # one droplet, one pipeline at a time

env:
  PACK_DIR: .
  TF_DIR: infra/terraform
  AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
  TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
  TF_VAR_ssh_public_key: ${{ secrets.KP2_SSH_PUBLIC_KEY }}
  TF_IN_AUTOMATION: "true"

jobs:
  federation:
    runs-on: ubuntu-latest
    timeout-minutes: 55 # cold deploy is ~13 min; image pulls and apt add more;
    # the FIRST postgres run also creates the managed DB cluster (~5-10 min
    # of DO provisioning inside the db-sync step)
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config=backend.hcl

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -auto-approve

      - name: cloud-init.yaml must be pure ASCII
        if: inputs.action != 'destroy'
        # One em dash or smart quote makes cloud-init reject the whole
        # cloud-config ("empty cloud config") and boot a droplet with no
        # docker and no /opt/kp2 - it only ever shows up as a warning
        # under `cloud-init status --long`, so catch it before apply.
        run: "! LC_ALL=C grep -n '[^[:print:][:blank:]]' $TF_DIR/cloud-init.yaml"

      - name: Terraform apply
        if: inputs.action != 'destroy'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve

      - name: Read droplet IP
        if: inputs.action != 'destroy'
        id: ip
        working-directory: ${{ env.TF_DIR }}
        run: echo "ip=$(terraform output -raw droplet_ip)" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        if: inputs.action != 'destroy'
        env:
          SSH_KEY: ${{ secrets.KP2_SSH_PRIVATE_KEY }}
          IP: ${{ steps.ip.outputs.ip }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # || true is load-bearing: the step runs under `bash -e`, and a
          # keyscan against a droplet whose sshd is not up yet exits non-zero
          # (connection refused, instantly) -- which killed the whole retry
          # loop on attempt 1 instead of waiting out the boot.
          for i in $(seq 1 30); do
            ssh-keyscan -T 5 "$IP" >> ~/.ssh/known_hosts 2>/dev/null || true
            [ -s ~/.ssh/known_hosts ] && exit 0
            sleep 10
          done
          echo "droplet never answered on 22" >&2; exit 1

      - name: Wait for cloud-init (docker + deps installed at boot)
        if: inputs.action != 'destroy'
        env:
          IP: ${{ steps.ip.outputs.ip }}
        # Exit 2 is "done, but with recoverable errors" (warnings), not a
        # boot failure — only 1 means cloud-init actually broke. --long
        # prints the recoverable errors so a degraded boot is visible in
        # the log; preflight in the deploy step is the real gate on
        # docker/compose/jq being there.
        run: ssh "root@$IP" cloud-init status --wait --long || [ $? -eq 2 ]

      - name: Sync checkout to droplet
        if: inputs.action != 'destroy'
        env:
          IP: ${{ steps.ip.outputs.ip }}
        # The WHOLE checkout including .git: join-api bind-mounts the
        # checkout and runs `git status` inside its container, so the files
        # alone are not enough (docker-compose.yml, join-api
        # stanza). --delete keeps redeploys clean; excludes cover the
        # gitignored/local-only trees so a running stack's out/ and .env
        # are not clobbered.
        #
        # ponytail: a re-sync onto a LIVE federation resets the join-written
        # state (configs/member-<key>/ deleted, manifest.yaml overwritten
        # from the checkout — apps/join-api/app.py commits both droplet-side).
        # Acceptance still passes: module 2.7's rows come from
        # hurl/topology.json, which is regenerated from the same reset
        # configs/, so a wiped member is skipped, not failed. What is lost is
        # the demo state — re-run the join after a `deploy`. Fix if that
        # becomes annoying: condition the excludes on the same live-stack
        # test remote-deploy.sh already does, rather than rsyncing blind.
        #
        # --chown: rsync -a preserves the sender's owner when the receiver is
        # root, and the runner's uid 1001 means nothing on the droplet. Git
        # then refuses the checkout as "dubious ownership" -- which breaks
        # tests/test_path_conformance.py's `git ls-files` and join-api's
        # in-container `git status` alike.
        run: |
          rsync -az --delete --chown=root:root \
            --exclude '.venv' --exclude '.pytest_cache' --exclude '__pycache__' \
            --filter 'protect **/out' --filter 'protect **/out/**' --filter 'protect **/.env' \
            ./ "root@$IP:/opt/kp2/repo/"

      # Postgres join store (deployment.yaml: datastore.kind: postgres) --
      # a fast no-op on sqlite. Applies infra/terraform-db with THIS
      # droplet's id (runbook §6.2's firewall re-trust, the manual step
      # nothing used to watch), ships the cluster CA cert, writes the DSNs
      # into the droplet's .env (mode 600, never argv, masked in logs) and
      # bootstraps the schema as admin -- all idempotent, so it simply
      # re-asserts itself on every up/deploy. BEFORE the deploy step,
      # deliberately: on a postgres deployment acceptance's module 2.7
      # reads the store via `python -m store dump-records`, so the store
      # must already work when remote-deploy.sh reaches acceptance.
      # `destroy` never touches the DB module: separate state key +
      # prevent_destroy on the cluster (plan §6.3) -- destroying the
      # cluster stays a deliberate laptop procedure, never a CI action.
      - name: Sync Postgres join store (no-op on sqlite)
        if: inputs.action != 'destroy'
        env:
          IP: ${{ steps.ip.outputs.ip }}
        run: bash "$PACK_DIR/infra/ci/db-sync.sh"

      - name: Deploy federation (gen-secrets -> preflight -> deploy -> seed -> acceptance)
        if: inputs.action != 'destroy'
        env:
          IP: ${{ steps.ip.outputs.ip }}
          REDEPLOY: ${{ inputs.redeploy && '1' || '0' }}
        run: ssh -o ServerAliveInterval=30 "root@$IP" "KP2_REDEPLOY=$REDEPLOY bash -s" < "$PACK_DIR/infra/ci/remote-deploy.sh"

      # Separate step, deliberately: remote-deploy.sh exits 0 early on an
      # already-live federation ("acceptance only"), so publish logic
      # appended to it would be skipped on the most common invocation.
      # Here it also means password rotation is a `deploy` re-run.
      - name: Publish console at https://<ip> (basic auth)
        if: inputs.action != 'destroy'
        env:
          IP: ${{ steps.ip.outputs.ip }}
          HTPASSWD: ${{ secrets.KP2_CONSOLE_HTPASSWD }}
        run: ssh "root@$IP" "KP2_CONSOLE_HTPASSWD='$HTPASSWD' bash -s" < "$PACK_DIR/infra/ci/console-publish.sh"

      - name: How to reach it
        if: inputs.action != 'destroy'
        env:
          IP: ${{ steps.ip.outputs.ip }}
        run: |
          {
            echo "## Federation is up on $IP"
            echo
            echo "**Console (public, basic auth):** https://$IP — share this with the audience."
            echo "The password is the one you hashed into KP2_CONSOLE_HTPASSWD."
            echo
            echo "Everything else binds to loopback on the droplet (by design — the"
            echo "Test CA must never face the internet). Tunnel in:"
            echo
            echo '```'
            echo "ssh -L 8090:127.0.0.1:8090 -L 4000:127.0.0.1:4000 -L 8091:127.0.0.1:8091 root@$IP"
            echo '```'
            echo
            echo "Console: http://127.0.0.1:8090 · CS UI: https://127.0.0.1:4000 · join-api: http://127.0.0.1:8091"
            echo
            echo "Done for the day? Re-run this workflow with action=destroy."
          } >> "$GITHUB_STEP_SUMMARY"
