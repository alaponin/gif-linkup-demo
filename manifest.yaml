kp: KP2
track: interoperability
title: Government Interoperability Framework
home: 10-Knowledge-Products/KP2-GIF
depends_on: []
building_blocks:
  - x-road-bus
  - member-pnea
  - member-plr
  - member-pnia
# Frozen identifiers — cross-pack join keys for KP3/KP4. Confirmed against the
# live registry at P5 (2026-07-25): all four members + subsystems and the
# owner present exactly as below (at the time); see acceptance.sh's 2.x checks.
# AMENDED 2026-08-06 (Wave 3 Task 1, D1): PROGRESSA/GOV/MOEYS:PEMIS and its
# pemis-api service removed. MoEYS is retired from the pack -- confirmed safe
# via `grep -rn "MOEYS\|PEMIS" 10-Knowledge-Products/KP3-DPI/` (no hits; KP3's
# config skeleton builds on PNIA/PLR, not MoEYS) -- sign-off obtained from the
# repo owner. See docs/production-delta.md for the full record.
identifiers:
  instance: PROGRESSA
  member_class: GOV
  owner: PROGRESSA/GOV/PDGA
  members:
    - PROGRESSA/GOV/PNEA:EXAMS
    - PROGRESSA/GOV/PLR:ENROLMENT
    - PROGRESSA/GOV/PNIA:IDENTITY
  services:
    - PROGRESSA/GOV/PNIA/IDENTITY/identity-api
    - PROGRESSA/GOV/PLR/ENROLMENT/enrolment-api
# Rich identity — names, subsystem descriptions — that configs/*.yaml used to
# duplicate by hand. identifiers: above stays the flat cross-pack contract,
# untouched; this is what hurl/generate.py actually reads. The two must agree
# -- hurl/check_scenarios.py checks that (Task 4 of
# docs/superpowers/plans/2026-07-26-agency-identity-rename-support.md).
identity:
  instance: PROGRESSA
  member_class: GOV
  owner:
    code: PDGA
    name: Progressa Digital Government Authority
    management_subsystem: MANAGEMENT
  # origin: canonical | joined, default canonical (hurl/generate.py already
  # reads it this way -- see docs/superpowers/plans/
  # 2026-07-27-kp2-member-parameterisation.md). Only a canonical member may
  # appear in identifiers.members above -- that block is the frozen
  # KP3/KP4 cross-pack contract, and a joined member entering it silently
  # would mean a demonstration join changing what other packs build against.
  members:
    pnea:
      code: PNEA
      name: Progressa National Examination Authority
      subsystem: EXAMS
      subsystem_description: Examination and certification services (consumer of identity + enrolment)
      origin: canonical
    plr:
      code: PLR
      name: Progressa Learner Registry
      subsystem: ENROLMENT
      subsystem_description: Authoritative learner enrolment register
      origin: canonical
    pnia:
      code: PNIA
      name: Progressa National Identity Authority
      subsystem: IDENTITY
      subsystem_description: Authoritative person identity register
      origin: canonical
modules:
  - id: "federation-core"
    video_ref: "5.5"   # Topic 5 subtopic this module realises
    title: "Stand up the federation core"
    building_blocks: [x-road-bus]
    config: configs/x-road-bus/federation-core.yaml
    scenarios: hurl/scenarios/00-cs-init.hurl, hurl/scenarios/01-cs-trust-services.hurl, hurl/scenarios/03-cs-anchor.hurl, hurl/scenarios/10-ss-pdga.hurl
    prompt: prompts/federation-core.md
    acceptance: acceptance/federation-core.md
  - id: "register-member"
    video_ref: "5.4"   # Topic 5 subtopic this module realises
    # Wave 3 Task 2 (S-01): 2.3/2.4/2.5 collapsed into this one entry -- all
    # three mapped to the same 5.4 claim ("the registration shape is
    # identical for every member", acceptance/2.2.md's own words before it
    # was retired in Task 1). Wave 3 Task 3 (S-02, D2) retargeted the id
    # from "2.3" to "register-member". scenarios: below is the
    # union of what the three used to claim (see hurl/check_scenarios.py).
    # config: stays a single existing path -- the ITU-Giga-KP-Plugin ship
    # gate's check_pack.py (a sibling pack, out of this pack's scope) parses
    # manifest.yaml with its own minimal scalar-only reader and does
    # os.path.exists(pack/config) per module; a comma-joined multi-path
    # string there is not a path and fails that gate. member_configs: below
    # carries the real one-per-member list, same order as building_blocks;
    # apps/console/app.py's _CONFIG_BY_MEMBER reads member_configs: (falling
    # back to config: for any future module with exactly one member
    # building block and no member_configs: key).
    title: "Register PNEA, PLR and PNIA — consumer and providers"
    building_blocks: [member-pnea, member-plr, member-pnia]
    config: configs/member-pnea/pnea.yaml
    member_configs: configs/member-pnea/pnea.yaml, configs/member-plr/plr.yaml, configs/member-pnia/pnia.yaml
    scenarios: hurl/scenarios/02-cs-members.hurl, hurl/scenarios/20-ss-pnia.hurl, hurl/scenarios/21-ss-plr.hurl, hurl/scenarios/23-ss-pnea.hurl, hurl/scenarios/30-services-pnia.hurl, hurl/scenarios/31-services-plr.hurl
    prompt: prompts/register-member.md
    acceptance: acceptance/register-member.md
  - id: "once-only-exchange"
    video_ref: "5.6"   # Topic 5 subtopic this module realises
    title: "Run the once-only exchange"
    building_blocks: [x-road-bus]
    config: configs/x-road-bus/once-only-exchange.yaml
    scenarios: ""   # proved by scripts/acceptance.sh, not by a scenario
    prompt: prompts/once-only-exchange.md
    acceptance: acceptance/once-only-exchange.md
  - id: "join-member"
    video_ref: "?"   # see below — no existing Topic 5 subtopic covers this
    title: "A new member joins the bus — the join API"
    building_blocks: [x-road-bus]
    config: configs/x-road-bus/join-policy.yaml
    scenarios: ""   # the join API runs step fragments; no static scenario file
    prompt: prompts/join-member.md
    acceptance: acceptance/join-member.md
