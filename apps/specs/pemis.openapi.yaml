# MoEYS/PEMIS API — the OpenAPI3 service description X-Road parses (module 2.2).
# No consumers in v0.1; PEMIS is the future enrolment source and the negative-
# check caller in 2.6.
openapi: 3.0.3
info:
  title: Progressa MoEYS — PEMIS school records API
  version: "1.0"
  description: School-census record lookup by NIN.
servers:
  - url: http://app-pemis:8000/v1
paths:
  /school-records/{nin}:
    get:
      operationId: getSchoolRecord
      summary: Fetch a learner's school-census record by NIN
      parameters:
        - name: nin
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9]{11}$'}
      responses:
        "200":
          description: The school-census record
          content:
            application/json:
              schema:
                type: object
                required: [nin, school, grade, census_year]
                properties:
                  nin: {type: string}
                  school: {type: string}
                  grade: {type: string}
                  census_year: {type: string}
        "404":
          description: No census record for this NIN
