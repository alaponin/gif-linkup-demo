openapi: "3.0.0"
info:
  title: PTSB Awards API
  version: "1.0"
servers:
  - url: http://app-ptsb:18765
paths:
  /awards/{id}:
    get:
      operationId: getAward
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, title]
                properties:
                  id: {type: string}
                  title: {type: string}
                  note: {type: string}
