# Federation core. Generated by bb-config-gen (prompts/federation-core.md).
# Do not hand-edit — regenerate. Spec: NIIS X-Road Central Server config (>=7.3).
module: "federation-core"
building_block: x-road-bus
central_server:
  # instance_identifier, owner (code/name/management_subsystem) and
  # member_classes[0].code all come from manifest.yaml's identity: block now
  # -- restating them here was never read by generate.py for .code (dead
  # field) and was a second, driftable copy for the rest. Dogfooded 2026-07-26.
  address: cs                      # container DNS name on the linkup network
  member_classes:
    - description: Government institutions of Progressa
trust_services:
  # Certificate files themselves are not a config field: hurl/generate.py reads
  # them from the shared ca volume (ca.pem/ocsp.pem/tsa.pem, no rename) per
  # decision 3 in PLAN.md -- a path here would be a second, driftable source of
  # truth for something the deployment already gets right. Dogfooded 2026-07-25.
  certification_service:
    certificate_profile: ee.ria.xroad.common.certificateprofile.impl.FiVRKCertificateProfileInfoProvider
    ocsp_responder:
      url: http://ca:8888
  timestamping_service:
    url: http://ca:8899
policy:
  # Each auth-cert and client registration request is approved explicitly over
  # the Central Server admin API during deployment (GET /management-requests
  # ?status=WAITING -> POST /{id}/approval). Nothing is written into
  # /etc/xroad/conf.d/local.ini and no service is restarted, so the approval
  # step stays visible in the run and the same sequence works unchanged against
  # a production Central Server, where auto-approval would be unacceptable.
  # The auto-approve-* flags remain a convenience for manual configuration only
  # (docs/production-delta.md). Verified against setup.hurl@7.7.0.
  management_request_approval: explicit
management_security_server:
  code: SS-PDGA
  dns_name: ss-pdga
  # owner is central_server.owner above -- hurl/generate.py builds this server
  # from that block directly; a second owner field here is drift, not a fact
  # generate.py reads. Dogfooded 2026-07-25.
demo_only:
  - test CA as trust anchor
  - fixed Central Server admin credentials (test image)
  - single-host federation
