# Port 80: ACME validation webroot and a redirect to HTTPS. Nothing else.
# Enabled FIRST by infra/ci/console-publish.sh, before any certificate
# exists, because certbot --webroot needs a listener here to answer the
# challenge -- and again on every renewal. It proxies nothing, so having
# it live while :443 is still dark exposes exactly one static directory.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
