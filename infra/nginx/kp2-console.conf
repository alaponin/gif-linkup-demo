# The ONLY public route into the droplet besides SSH (infra/CONSOLE-EXPOSURE.md).
# Proxies two loopback ports: the console on 8090 (basic auth, every path) and
# join-api's APPLICANT ROUTES ONLY on 8091 (its own bearer tokens, no basic
# auth). Adding a location/upstream here is a security decision, not an edit --
# the /join/ block below is that clause being exercised, and CONSOLE-EXPOSURE.md
# section 7 is the decision record for it.
#
# Enabled by infra/ci/console-publish.sh only after the htpasswd file and
# the IP certificate both exist -- referencing either before it is written
# makes `nginx -t` fail, which is the fail-closed behaviour we want.
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=exchange:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=join:10m rate=6r/m;

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_tokens off;

    # --cert-name kp2-console keeps this path stable across renewals.
    ssl_certificate     /etc/letsencrypt/live/kp2-console/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kp2-console/privkey.pem;

    auth_basic           "restricted";          # deliberately uninformative realm
    auth_basic_user_file /etc/nginx/kp2.htpasswd;

    limit_req zone=general burst=20 nodelay;

    # Every /api/exchange hit is several real, authenticated X-Road calls.
    location /api/exchange/ {
        limit_req zone=exchange burst=5;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;            # console's Origin-vs-Host check depends on this
        proxy_read_timeout 60s;
    }

    # join-api: applicant surface ONLY (infra/CONSOLE-EXPOSURE.md section 7).
    # `auth_basic off` is load-bearing, not laxity: nginx basic auth and
    # join-api's bearer tokens both use the Authorization header and cannot
    # coexist -- join-api's own two-role token auth is the credential here.
    # Everything not listed (GET /requests operator queue, approve/resume/
    # reject, DELETE /members, /health) has no location and is 404'd by the
    # catch-all below, so a leaked operator token is internet-inert.
    location = /join/requests {
        limit_except POST { deny all; }       # GET /requests is the operator queue -- not public
        auth_basic off;
        limit_req zone=join burst=3 nodelay;  # each submission runs 13 checks, a spec fetch, a generate.py dry run
        rewrite ^/join(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location ~ ^/join/requests/[A-Za-z0-9_-]+$ {  # applicant polls its outcome; $ anchors out .../approve
        limit_except GET { deny all; }
        auth_basic off;
        limit_req zone=general burst=20 nodelay;
        rewrite ^/join(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
    }

    location = /join/catalogue {
        limit_except GET { deny all; }
        auth_basic off;
        limit_req zone=general burst=20 nodelay;
        rewrite ^/join(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
    }

    # Every other /join/ path -- the whole operator surface -- 404s here rather
    # than falling through to `location /` and reaching the console. The three
    # locations above still win: exact and regex matches outrank this prefix.
    location /join/ {
        auth_basic off;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;                # /api/reset performs several logins at up to 10 s each
    }
}
