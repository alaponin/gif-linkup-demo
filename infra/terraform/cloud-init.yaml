#cloud-config
# Everything scripts/preflight.sh checks for, installed once at boot:
# docker + compose v2 (plugin form, from Docker's own apt repo - the
# standalone v1 binary does not satisfy preflight), jq, curl,
# python3 >= 3.9 with PyYAML and venv (scripts/verify.sh builds the pack's
# test venv on first run), sha256sum/bash4 (in Ubuntu base), git
# (join-api runs `git status` inside its container against the mounted
# checkout, but the deploy flow also uses git on the host).
# CI waits on `cloud-init status --wait` before deploying.

package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - jq
  - git
  - python3
  - python3-yaml
  - python3-venv
  - rsync
  - nginx

runcmd:
  # The identity the console and join-api containers run as -- NOT root, which
  # is what they ran as before, and join-api parses applicant-controlled
  # payloads while bind-mounting this host's checkout, so root there means a
  # compromised join-api process owns the host. Fixed uid/gid, because they
  # have to mean the same thing
  # on both sides of a bind mount; -M and nologin, because nobody ever logs
  # in as it. infra/ci/remote-deploy.sh exports KP2_CONTAINER_UID=10001 and
  # chowns the handful of paths those containers may write; it also recreates
  # this identity if it is missing, so a droplet provisioned before this
  # block existed still gets it.
  - groupadd -f -g 10001 kp2
  - id -u kp2 >/dev/null 2>&1 || useradd -u 10001 -g kp2 -M -s /usr/sbin/nologin kp2
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - timedatectl set-ntp true
  # Console exposure (infra/CONSOLE-EXPOSURE.md): nginx is installed
  # but serves nothing at boot - infra/ci/console-publish.sh copies the
  # site configs in and enables them, in an order that never exposes the
  # console before auth and TLS material exist. Ubuntu 24.04's apt certbot
  # is too old for IP certificates; those need >= 5.4, hence the snap.
  - rm -f /etc/nginx/sites-enabled/default
  - systemctl reload nginx
  - snap install --classic certbot
  - ln -sf /snap/bin/certbot /usr/bin/certbot
  - mkdir -p /opt/kp2
